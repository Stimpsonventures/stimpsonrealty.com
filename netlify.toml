[build]
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "zisi"
  included_files = ["private/Stimpson_Realty_Buyer_Guide.pdf"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
